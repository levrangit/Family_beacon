name: Backend Tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-test.yml"

  push:
    branches:
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend-test.yml"

permissions:
  contents: read

jobs:
  test:
    name: Run backend pytest
    runs-on: ubuntu-latest

    env:
      # Supabase project URL is public configuration, not a secret.
      SUPABASE_URL: https://iybyejjezzagmtxskjcp.supabase.co
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FAMILY_BEACON_API_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Validate test environment
        run: |
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL is not configured"; exit 1; }
          test -n "$SUPABASE_KEY" || { echo "SUPABASE_KEY GitHub Secret is not configured"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "SUPABASE_SERVICE_ROLE_KEY GitHub Secret is not configured"; exit 1; }

      - name: Create temporary test parent
        run: |
          export TEST_PARENT_EMAIL="pytest-ci-parent-$(python -c 'import uuid; print(uuid.uuid4().hex)')@example.com"
          export TEST_PARENT_PASSWORD="Ci-Test-$(python -c 'import uuid; print(uuid.uuid4().hex)')-Aa1!"
          export TEST_SECOND_PARENT_PASSWORD="Ci-Test-$(python -c 'import uuid; print(uuid.uuid4().hex)')-Bb2!"

          echo "::add-mask::$TEST_PARENT_PASSWORD"
          echo "::add-mask::$TEST_SECOND_PARENT_PASSWORD"

          RESPONSE=$(curl --fail --silent --show-error \
            -X POST "$SUPABASE_URL/auth/v1/admin/users" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data "$(python -c 'import json, os; print(json.dumps({"email": os.environ["TEST_PARENT_EMAIL"], "password": os.environ["TEST_PARENT_PASSWORD"], "email_confirm": True, "user_metadata": {"telegram_id": 900000000 + __import__("uuid").uuid4().int % 100000000}}))')")

          echo "$RESPONSE" > /tmp/test-parent-response.json
          TEST_PARENT_USER_ID=$(python -c 'import json; print(json.load(open("/tmp/test-parent-response.json"))["id"])')

          echo "TEST_PARENT_EMAIL=$TEST_PARENT_EMAIL" >> "$GITHUB_ENV"
          echo "TEST_PARENT_PASSWORD=$TEST_PARENT_PASSWORD" >> "$GITHUB_ENV"
          echo "TEST_SECOND_PARENT_PASSWORD=$TEST_SECOND_PARENT_PASSWORD" >> "$GITHUB_ENV"
          echo "TEST_PARENT_USER_ID=$TEST_PARENT_USER_ID" >> "$GITHUB_ENV"

      - name: Start backend
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 8000 \
            > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 1
          done

          echo "Backend did not become ready"
          cat backend/backend.log
          exit 1

      - name: Run backend tests
        run: |
          PYTHONPATH=backend pytest backend/tests

      - name: Stop backend
        if: always()
        working-directory: backend
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" 2>/dev/null || true
          fi

      - name: Delete temporary test parent
        if: always()
        run: |
          if [ -n "${TEST_PARENT_USER_ID:-}" ]; then
            curl --fail --silent --show-error \
              -X DELETE "$SUPABASE_URL/auth/v1/admin/users/$TEST_PARENT_USER_ID" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              >/dev/null
          fi
