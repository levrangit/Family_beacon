name: Backend Tests

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-test.yml"

  push:
    branches:
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend-test.yml"

permissions:
  contents: read

jobs:
  test:
    name: Run backend pytest
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      TEST_PARENT_EMAIL: ${{ secrets.TEST_PARENT_EMAIL }}
      TEST_PARENT_PASSWORD: ${{ secrets.TEST_PARENT_PASSWORD }}
      FAMILY_BEACON_API_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Validate test environment
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          test -n "$TEST_PARENT_EMAIL"
          test -n "$TEST_PARENT_PASSWORD"

      - name: Start backend
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 8000 \
            > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 1
          done

          echo "Backend did not become ready"
          cat backend/backend.log
          exit 1

      - name: Run backend tests
        run: |
          PYTHONPATH=backend pytest backend/tests

      - name: Stop backend
        if: always()
        working-directory: backend
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" 2>/dev/null || true
          fi
